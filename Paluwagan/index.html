<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustFund — Sign In</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <!-- ── Left Branding Panel ── -->
    <div class="auth-left">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <!-- Plus icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <span class="auth-brand-name">TrustFund</span>
      </div>

      <h1 class="auth-tagline">Community savings,<br>built on trust</h1>
      <p class="auth-tagline-desc">
        Join or create a group savings circle with your friends, family, or colleagues.
        Transparent, trackable, and trustworthy.
      </p>
    </div>

    <!-- ── Right Form Panel ── -->
    <div class="auth-right">
      <div class="auth-right-inner">

        <!-- Tab Toggle -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" role="tab" aria-selected="true"
                  onclick="window.location.href='index.html'">Sign In</button>
          <button class="auth-tab" role="tab" aria-selected="false"
                  onclick="window.location.href='pages/create-account.html'">Create Account</button>
        </div>

        <!-- Heading -->
        <h2 class="auth-heading">Welcome Back</h2>
        <p class="auth-subheading">Sign in to manage your savings groups</p>

        <!-- Form -->
        <form action="pages/dashboard.html" method="get" novalidate
              onsubmit="return validateForm(event)">
          <div class="form-group">
            <label class="input-label" for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              class="input-field"
              placeholder=""
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label class="input-label" for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                class="input-field"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button class="password-toggle" type="button"
                      onclick="togglePassword('password', this)"
                      aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="btn-primary" type="submit">Sign In</button>
        </form>

        <!-- Demo Accounts -->
        <div class="demo-divider">
          <span class="demo-divider-line"></span>
          <span class="demo-divider-text">Demo Accounts</span>
          <span class="demo-divider-line"></span>
        </div>

        <button class="demo-btn" type="button"
                onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='admin123'">
          Admin: admin / admin123
        </button>

      </div>
    </div>

  </div>

  <script>
    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const isHidden = field.type === 'password';
      field.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }

    function validateForm(e) {
      const fields = document.querySelectorAll('[required]');
      let valid = true;
      fields.forEach(f => {
        if (!f.value.trim()) {
          f.style.borderColor = 'var(--color-primary)';
          f.style.boxShadow   = '0 0 0 3px rgba(232,72,26,0.15)';
          valid = false;
          f.addEventListener('input', () => {
            f.style.borderColor = '';
            f.style.boxShadow   = '';
          }, { once: true });
        }
      });
      if (!valid) e.preventDefault();
      return valid;
    }
  </script>
</body>
</html>
