<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustFund — My Profile</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/my-profile.css" />
</head>
<body>
  <div class="app-layout">

    <!-- ══════════════════════════════
         SIDEBAR
    ══════════════════════════════ -->
    <aside class="sidebar">
      <div class="sidebar-logo">TrustFund</div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>

        <a href="dashboard.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <path d="M9 21V12h6v9"/>
          </svg>
          Dashboard
        </a>

        <a href="my-groups.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          My Groups
        </a>

        <a href="payments.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M2 10h20"/>
          </svg>
          Payments
        </a>

        <a href="my-profile.html" class="sidebar-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          My Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">User</div>
          <div class="sidebar-user-role">Member</div>
        </div>
        <a href="../index.html" class="sidebar-logout-btn" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- ══════════════════════════════
         MAIN CONTENT
    ══════════════════════════════ -->
    <div class="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">My Profile</span>
        </div>
        <div class="topbar-right">
          <button class="notif-btn" id="notif-btn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notif-badge" id="notif-badge" style="display:none;"></span>
          </button>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-content">

        <!-- Profile Hero Section -->
        <div class="profile-hero">
          <div class="profile-hero-avatar" id="profile-avatar" onclick="document.getElementById('avatar-file').click()" title="Click to change photo" role="button" tabindex="0">
            <span class="avatar-initials">U</span>
            <input type="file" id="avatar-file" accept="image/*" class="file-input-hidden"
                   onchange="previewAvatar(event)" />
          </div>
          <div class="profile-hero-info">
            <h1 class="profile-hero-name">User</h1>
            <p class="profile-hero-meta">@username · user@email.com</p>
            <div class="profile-badges">
              <span class="badge badge-verified">Verified</span>
            </div>
          </div>
        </div>

        <!-- Personal Information Card -->
        <div class="profile-card">
          <h2 class="profile-card-title">Personal Information</h2>
          
          <form id="profile-form" class="profile-form">
            <!-- Full Name + Phone -->
            <div class="form-row">
              <div class="form-group">
                <label class="input-label" for="profile-fullname">Full Name</label>
                <input type="text" id="profile-fullname" name="fullname"
                       class="input-field" value="User" />
              </div>
              <div class="form-group">
                <label class="input-label" for="profile-phone">Phone</label>
                <input type="tel" id="profile-phone" name="phone"
                       class="input-field" value="09XX XXX XXXX" />
              </div>
            </div>

            <!-- Occupation + Address -->
            <div class="form-row">
              <div class="form-group">
                <label class="input-label" for="profile-occupation">Occupation</label>
                <input type="text" id="profile-occupation" name="occupation"
                       class="input-field" value="N/A" />
              </div>
              <div class="form-group">
                <label class="input-label" for="profile-address">Address</label>
                <input type="text" id="profile-address" name="address"
                       class="input-field" value="N/A" />
              </div>
            </div>

            <!-- Save Changes Button -->
            <button type="submit" class="btn-primary btn-save">Save Changes</button>
          </form>
        </div>

        <!-- Groups Summary Card -->
        <div class="profile-card">
          <h2 class="profile-card-title">Groups Summary</h2>
          <p class="profile-summary-text">Not a member of any groups yet.</p>
        </div>

      </div><!-- /page-content -->
    </div><!-- /main-content -->

  </div><!-- /app-layout -->

  <script>
    // Preview Avatar
    function previewAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const avatar = document.getElementById('profile-avatar');
        avatar.style.backgroundImage = `url(${e.target.result})`;
        avatar.style.backgroundSize = 'cover';
        avatar.style.backgroundPosition = 'center';
        avatar.querySelector('.avatar-initials').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // Handle Form Submission
    document.getElementById('profile-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Here you would send data to the backend
      console.log('Profile updated');
    });
  </script>

  <!-- Notification Overlay + Panel -->
  <div class="notif-overlay" id="notif-overlay"></div>
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button class="mark-all-btn" id="mark-all-btn">Mark all read</button>
    </div>
    <div class="notif-list" id="notif-list">
      <div class="notif-empty">
        <p>No notifications</p>
        <span>You're all caught up!</span>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="../js/notifications.js"></script>
</body>
</html>
