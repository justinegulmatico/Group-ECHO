<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustFund — Create Account</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <style>
    /* No-scroll: lock the page to the viewport */
    html, body  { height: 100%; overflow: hidden; }
    .auth-page  { height: 100vh; overflow: hidden; }

    /* Keep outer padding identical to index.html (48px 56px) so the tab starts at the same position */

    /* Compress heading gap only — tab position stays matched */
    .auth-tabs       { margin-bottom: 14px; }

    /* Photo row: two frames side-by-side, both center-aligned vertically */
    .photo-row {
      margin-bottom: 8px;
      align-items: center;
    }

    .photo-upload { width: 72px; height: 72px; }
    .photo-fields { gap: 10px; }

    /* Compact form fields */
    .form-row    { gap: 12px; margin-bottom: 8px; }
    .form-group  { margin-bottom: 8px; }
    .input-label { font-size: 12px; margin-bottom: 0px; }
    .input-field { padding: 8px 12px; font-size: 13.5px; }

    /* Compact file input */
    .file-input-btn,
    .file-input-text { padding: 8px 14px; font-size: 13px; }

    /* Compact submit button */
    .btn-primary { padding: 11px 24px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="auth-page">

    <!-- ── Left Branding Panel ── -->
    <div class="auth-left">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <span class="auth-brand-name">TrustFund</span>
      </div>
      <h1 class="auth-tagline">Community savings,<br>built on trust</h1>
      <p class="auth-tagline-desc">
        Join or create a group savings circle with your friends, family, or colleagues.
        Transparent, trackable, and trustworthy.
      </p>
    </div>

    <!-- ── Right Form Panel ── -->
    <div class="auth-right">
      <div class="auth-right-inner">

        <!--
          Tab Toggle:
          Sign In = left (inactive), Create Account = right (active)
          — mirrors the exact position as in index.html
        -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab" role="tab" aria-selected="false"
                  onclick="window.location.href='../index.html'">Sign In</button>
          <button class="auth-tab active" role="tab" aria-selected="true">Create Account</button>
        </div>

        <h2 class="auth-heading">Create Account</h2>
        <p class="auth-subheading">Join the community savings platform</p>

        <!-- Native form — required validation built-in, submits to dashboard -->
        <form action="dashboard.html" method="get" novalidate
              onsubmit="return validateForm(event)">

          <!-- Photo upload + Full Name + Username -->
          <div class="photo-row">
            <div class="photo-upload" id="photo-circle"
                 onclick="document.getElementById('photo-input').click()"
                 title="Upload profile photo" role="button" tabindex="0">
              <svg class="photo-upload-icon" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                   stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="photo-upload-label">Photo</span>
              <input id="photo-input" type="file" accept="image/*" class="file-input-hidden"
                     onchange="previewPhoto(event)" />
            </div>

            <div class="photo-fields">
              <div>
                <label class="input-label" for="full-name">Full Name</label>
                <input id="full-name" name="full_name" type="text"
                       class="input-field" required />
              </div>
              <div>
                <label class="input-label" for="username">Username</label>
                <input id="username" name="username" type="text"
                       class="input-field" required />
              </div>
            </div>
          </div>

          <!-- Email + Phone -->
          <div class="form-row">
            <div>
              <label class="input-label" for="email">Email</label>
              <input id="email" name="email" type="email"
                     class="input-field" required />
            </div>
            <div>
              <label class="input-label" for="phone">Phone</label>
              <input id="phone" name="phone" type="tel"
                     class="input-field" required />
            </div>
          </div>

          <!-- Occupation + Address -->
          <div class="form-row">
            <div>
              <label class="input-label" for="occupation">Occupation</label>
              <input id="occupation" name="occupation" type="text"
                     class="input-field" required />
            </div>
            <div>
              <label class="input-label" for="address">Address</label>
              <input id="address" name="address" type="text"
                     class="input-field" required />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="input-label" for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password"
                     class="input-field" placeholder="••••••••"
                     autocomplete="new-password" required />
              <button class="password-toggle" type="button"
                      onclick="togglePassword('password', this)"
                      aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Proof of Employment (optional — no required) -->
          <div class="form-group">
            <label class="input-label">
              Proof of Employment/Income
              <span class="label-optional">(optional)</span>
            </label>
            <div class="file-input-wrap">
              <button type="button" class="file-input-btn"
                      onclick="document.getElementById('proof-file').click()">Choose File</button>
              <span class="file-input-text" id="file-name-display">No file chosen</span>
              <input type="file" class="file-input-hidden" id="proof-file"
                     onchange="document.getElementById('file-name-display').textContent =
                               this.files[0]?.name || 'No file chosen'" />
            </div>
          </div>

          <button class="btn-primary" type="submit">Create Account</button>
        </form>

      </div>
    </div>
  </div>

  <script>
    /* Password eye toggle — identical to index.html */
    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const isHidden = field.type === 'password';
      field.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function previewPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const circle = document.getElementById('photo-circle');
        circle.style.backgroundImage  = `url(${e.target.result})`;
        circle.style.backgroundSize   = 'cover';
        circle.style.backgroundPosition = 'center';
        circle.querySelector('svg').style.display   = 'none';
        circle.querySelector('.photo-upload-label').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    /* Form validation — highlights empty required fields */
    function validateForm(e) {
      const fields = document.querySelectorAll('[required]');
      let valid = true;
      fields.forEach(f => {
        if (!f.value.trim()) {
          f.style.borderColor = 'var(--color-primary)';
          f.style.boxShadow   = '0 0 0 3px rgba(232,72,26,0.15)';
          valid = false;
          f.addEventListener('input', () => {
            f.style.borderColor = '';
            f.style.boxShadow   = '';
          }, { once: true });
        }
      });
      if (!valid) e.preventDefault();
      return valid;
    }
  </script>
</body>
</html>
