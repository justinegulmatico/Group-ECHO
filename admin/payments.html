<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustFund — Admin · Payments</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/payments.css" />
</head>
<body>
  <div class="app-layout">

    <!-- ══════════════════════════════
         SIDEBAR
    ══════════════════════════════ -->
    <aside class="sidebar">
      <div class="sidebar-logo">TrustFund</div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>

        <a href="dashboard.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/>
          </svg>
          Dashboard
        </a>
        <a href="my-groups.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          My Groups
        </a>
        <a href="payments.html" class="sidebar-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
          </svg>
          Payments
        </a>
        <a href="my-profile.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          My Profile
        </a>

        <div class="sidebar-section-label">Admin</div>

        <a href="admin-panel.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
          Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar admin-avatar" id="sidebar-avatar">SA</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">System Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
        <a href="../index.html" class="sidebar-logout-btn" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- ══════════════════════════════
         MAIN CONTENT
    ══════════════════════════════ -->
    <div class="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">Payments</span>
        </div>
        <div class="topbar-right">
          <button class="notif-btn" id="notif-btn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notif-badge" id="notif-badge" style="display:none;"></span>
          </button>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-content">

        <div class="section-title">Payment History</div>

        <!-- Empty State (default) -->
        <div class="empty-state">
          <div class="empty-state-title">No payment records</div>
          <div class="empty-state-desc">Join a group to start tracing payments.</div>
        </div>

        <!--
          Payment history table — populated by JS later

          <div class="table-card">
            <table class="payments-table">
              <thead>
                <tr>
                  <th>Group</th>
                  <th>Cycle</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="cell-group">Group Name</td>
                  <td>#1</td>
                  <td class="cell-amount">₱1,000</td>
                  <td class="cell-method">GCash</td>
                  <td class="cell-date">Jan 1, 2025</td>
                  <td><span class="badge badge-paid">Paid</span></td>
                </tr>
                <tr>
                  <td class="cell-group">Group Name</td>
                  <td>#2</td>
                  <td class="cell-amount received">₱10,000</td>
                  <td class="cell-method">Bank Transfer</td>
                  <td class="cell-date">Feb 1, 2025</td>
                  <td><span class="badge badge-pending">Pending</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        -->

      </div><!-- /page-content -->
    </div><!-- /main-content -->

  </div><!-- /app-layout -->


  <!-- Notification Overlay + Panel -->
  <div class="notif-overlay" id="notif-overlay"></div>
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button class="mark-all-btn" id="mark-all-btn">Mark all read</button>
    </div>
    <div class="notif-list" id="notif-list">
      <div class="notif-empty">
        <p>No notifications</p>
        <span>You're all caught up!</span>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="../js/notifications.js"></script>
</body>
</html>
