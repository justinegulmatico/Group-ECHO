<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustFund — Admin · My Groups</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/my-groups.css" />
</head>
<body>
  <div class="app-layout">

    <!-- ══════════════════════════════
         SIDEBAR
    ══════════════════════════════ -->
    <aside class="sidebar">
      <div class="sidebar-logo">TrustFund</div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>

        <a href="dashboard.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/>
          </svg>
          Dashboard
        </a>
        <a href="my-groups.html" class="sidebar-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          My Groups
        </a>
        <a href="payments.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
          </svg>
          Payments
        </a>
        <a href="my-profile.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          My Profile
        </a>

        <div class="sidebar-section-label">Admin</div>

        <a href="admin-panel.html" class="sidebar-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
          Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar admin-avatar" id="sidebar-avatar">SA</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">System Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
        <a href="../index.html" class="sidebar-logout-btn" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- ══════════════════════════════
         MAIN CONTENT
    ══════════════════════════════ -->
    <div class="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">My Groups</span>
        </div>
        <div class="topbar-right">
          <button class="notif-btn" id="notif-btn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notif-badge" id="notif-badge" style="display:none;"></span>
          </button>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-content">

        <!-- Toolbar -->
        <div class="page-toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
              <input class="search-input" type="text" placeholder="Search groups…" />
            </div>
          </div>
          <div class="toolbar-right">
            <button class="btn-outline">Join with Code</button>
            <button class="btn-create" id="open-create-modal">+ Create Group</button>
          </div>
        </div>

        <!-- Empty State (default) -->
        <div class="empty-state">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <div class="empty-state-title">No Groups found</div>
          <div class="empty-state-desc">Create a new group or join one with an invite code.</div>
        </div>

        <!--
          Group cards grid — shown when groups exist (populated by JS later)

          <div class="group-cards-grid">
            <a href="group-details-overview.html" class="group-card">
              <div class="group-card-top">
                <div>
                  <div class="group-card-name">Group Name</div>
                  <div class="group-card-meta">Monthly · ₱1,000/cycle</div>
                </div>
                <span class="badge badge-active">active</span>
              </div>
              <div class="group-card-collected">₱0 collected</div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width:0%"></div>
              </div>
              <div class="group-card-bottom">
                <div class="member-chips">
                  <div class="member-chip">AB</div>
                </div>
                <span class="group-card-members">1 / 10 members</span>
              </div>
            </a>
          </div>
        -->

      </div><!-- /page-content -->
    </div><!-- /main-content -->

  </div><!-- /app-layout -->


  <!-- ══════════════════════════════
       CREATE GROUP MODAL
  ══════════════════════════════ -->
  <div class="modal-overlay" id="modal-create" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New Group</span>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">

        <div class="form-group">
          <label class="input-label" for="cg-name">Group Name</label>
          <input class="input-field" id="cg-name" type="text"
                 placeholder="e.g. Barkada Savings 2025" />
        </div>

        <div class="form-group">
          <label class="input-label" for="cg-desc">Description <span style="font-weight:400;color:var(--color-text-muted)">(optional)</span></label>
          <input class="input-field" id="cg-desc" type="text"
                 placeholder="What is this group for?" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="input-label" for="cg-amount">Contribution Amount (₱)</label>
            <input class="input-field" id="cg-amount" type="number"
                   placeholder="1000" min="1" />
          </div>
          <div class="form-group">
            <label class="input-label" for="cg-slots">Total Slots</label>
            <input class="input-field" id="cg-slots" type="number"
                   placeholder="10" min="2" max="50" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="input-label" for="cg-frequency">Payment Frequency</label>
            <select class="input-field select-field" id="cg-frequency">
              <option value="monthly">Monthly</option>
              <option value="biweekly">Bi-weekly</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>
          <div class="form-group">
            <label class="input-label" for="cg-startdate">Start Date</label>
            <input class="input-field" id="cg-startdate" type="date" />
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn-primary" type="button">Create Group</button>
      </div>
    </div>
  </div>


  <!-- ══════════════════════════════
       JOIN WITH CODE MODAL
  ══════════════════════════════ -->
  <div class="modal-overlay modal-join" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Join a Group</span>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">

        <div class="form-group">
          <label class="input-label" for="join-code">Invite code</label>
          <input class="input-field join-code" id="join-code" type="text"
                 placeholder="Enter code" maxlength="8" />
        </div>

        <!-- Join preview — shown after code lookup -->
        <!--
        <div class="join-preview">
          <div class="join-preview-name">Group Name</div>
          <div class="join-preview-meta">Monthly · ₱1,000/cycle · 4/10 members</div>
          <span class="badge badge-active" style="align-self:flex-start;margin-top:4px;">active</span>
        </div>
        -->

      </div>
      <div class="modal-footer">
        <button class="btn-outline btn-preview">Preview</button>
        <button class="btn-create">Request to Join</button>
      </div>
    </div>
  </div>


  <!-- Notification Overlay + Panel -->
  <div class="notif-overlay" id="notif-overlay"></div>
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button class="mark-all-btn" id="mark-all-btn">Mark all read</button>
    </div>
    <div class="notif-list" id="notif-list">
      <div class="notif-empty">
        <p>No notifications</p>
        <span>You're all caught up!</span>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script>
    const openCreateModal = document.getElementById('open-create-modal');
    const modalCreate = document.getElementById('modal-create');

    if (openCreateModal && modalCreate) {
      openCreateModal.addEventListener('click', () => {
        modalCreate.style.display = 'flex';
      });

      const closeButtons = modalCreate.querySelectorAll('.modal-close, .btn-outline');
      closeButtons.forEach(button => {
        button.addEventListener('click', () => {
          modalCreate.style.display = 'none';
        });
      });

      modalCreate.addEventListener('click', event => {
        if (event.target === modalCreate) {
          modalCreate.style.display = 'none';
        }
      });
    }
    /* =========================================
     JOIN WITH CODE MODAL
  ========================================= */

  const joinBtn = document.querySelector('.btn-outline');
  const joinModal = document.querySelector('.modal-join');
  const joinCodeInput = document.querySelector('.join-code');

  const joinCloseBtns =
    joinModal.querySelectorAll('.modal-close');

  const previewBtn =
    joinModal.querySelector('.modal-footer .btn-outline');

  const requestBtn =
    joinModal.querySelector('.modal-footer .btn-create');

  /* =========================================
     CREATE PREVIEW CARD
  ========================================= */

  const joinPreviewContainer = document.createElement('div');

  joinPreviewContainer.className =
    'join-preview hidden';

  joinPreviewContainer.innerHTML = `
    <div class="join-preview-top">
      <div>
        <div class="join-preview-name" id="preview-name"></div>
        <div class="join-preview-meta" id="preview-meta"></div>
      </div>

      <span class="badge badge-active">
        active
      </span>
    </div>

    <div class="join-preview-progress">
      <div class="join-preview-progress-fill"></div>
    </div>

    <div class="join-preview-members">
      <div class="member-chips">
        <div class="member-chip">--</div>
      </div>

      <span id="preview-members-text"></span>
    </div>
  `;

  joinModal
    .querySelector('.modal-body')
    .appendChild(joinPreviewContainer);

  /* Hide request button initially */
  requestBtn.style.display = 'none';

  /* =========================================
     OPEN JOIN MODAL
  ========================================= */

  joinBtn.addEventListener('click', () => {
    joinModal.style.display = 'flex';
  });

  /* =========================================
     CLOSE JOIN MODAL
  ========================================= */

  function closeJoinModal() {
    joinModal.style.display = 'none';

    joinCodeInput.value = '';

    joinPreviewContainer.classList.add('hidden');

    requestBtn.style.display = 'none';
  }

  joinCloseBtns.forEach(btn => {
    btn.addEventListener('click', closeJoinModal);
  });

  joinModal.addEventListener('click', e => {
    if (e.target === joinModal) {
      closeJoinModal();
    }
  });

  /* =========================================
     PREVIEW GROUP
  ========================================= */

  previewBtn.addEventListener('click', () => {
    const code =
      joinCodeInput.value.trim().toUpperCase();

    if (!code) {
      alert('Please enter a group code.');
      return;
    }

    /*
      No groups yet.
      Replace this later with real database lookup.
    */
    const group = null;

    /* =====================================
       NO GROUP FOUND
    ===================================== */

    if (!group) {
      joinPreviewContainer.classList.remove('hidden');

      const badgeEl = joinPreviewContainer.querySelector('.badge');
      if (badgeEl) badgeEl.style.display = 'none';

      document.getElementById('preview-name').textContent = 'No group found';

      document.getElementById('preview-meta').textContent =
        'The code you entered is invalid.';

      joinPreviewContainer
        .querySelector('.join-preview-progress-fill')
        .style.width = '0%';

      document.getElementById('preview-members-text').textContent = '';

      requestBtn.style.display = 'none';

      return;
    }

    /* =====================================
       FUTURE REAL GROUP DATA
    ===================================== */

    document.getElementById('preview-name').textContent = group.name;

    document.getElementById('preview-meta').textContent =
      `${group.frequency} · ${group.amount}`;

    document.getElementById('preview-members-text').textContent = group.members;

    joinPreviewContainer
      .querySelector('.join-preview-progress-fill')
      .style.width = group.progress;

    const badgeEl2 = joinPreviewContainer.querySelector('.badge');
    if (badgeEl2) badgeEl2.style.display = 'inline-flex';

    joinPreviewContainer.classList.remove('hidden');

    requestBtn.style.display = 'inline-flex';
  });

  /* =========================================
     REQUEST TO JOIN
  ========================================= */

  requestBtn.addEventListener('click', () => {
    alert('Join request sent successfully!');
    closeJoinModal();
  });
  </script>
  <script src="../js/notifications.js"></script>
</body>
</html>
